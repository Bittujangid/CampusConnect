<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px var(--shadow-color);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .profile-info h2 {
            margin: 0 0 0.5rem 0;
            color: var(--text-color);
        }

        .profile-role {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-color);
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--card-border);
            border-radius: 0.5rem;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
        }

        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--card-bg);
        }

        .btn-save {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        .btn-save:hover {
            background: var(--secondary-color);
            transform: translateY(-1px);
        }

        .btn-save:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .event-item {
            padding: 1.5rem;
            border: 1px solid var(--card-border);
            border-radius: 0.5rem;
            background: var(--bg-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px var(--shadow-color);
        }

        .event-item h3 {
            margin: 0 0 0.5rem 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .event-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--text-light);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .event-meta i {
            margin-right: 0.25rem;
        }

        .success-msg {
            display: none;
            padding: 1rem;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .loader {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (min-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1><i class="fas fa-user-circle"></i> My Profile</h1>
            </div>
            <div class="toolbar">
                <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loadingState" style="text-align: center; padding: 4rem;">
            <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color)"></i>
            <p style="margin-top: 1rem; color: var(--text-light);">Loading profile info...</p>
        </div>

        <div id="profileContent" class="profile-container" style="display: none;">
            <!-- Left Column: Edit Profile -->
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-info">
                        <h2 id="displayName">Loading...</h2>
                        <span id="displayRole" class="profile-role">...</span>
                    </div>
                </div>

                <div id="successMsg" class="success-msg">
                    <i class="fas fa-check-circle"></i> Profile updated successfully!
                </div>

                <form id="profileForm">
                    <div class="form-group">
                        <label for="nameInput">Full Name</label>
                        <input type="text" id="nameInput" required>
                    </div>
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" disabled>
                    </div>
                    <div class="form-group">
                        <label for="studentIdInput">Student ID</label>
                        <input type="text" id="studentIdInput" disabled>
                    </div>
                    <button type="submit" class="btn-save" id="saveBtn">
                        <i class="fas fa-save"></i> <span>Save Changes</span>
                    </button>
                </form>
            </div>

            <!-- Right Column: Registered Events -->
            <div class="profile-card" style="display: flex; flex-direction: column;">
                <h2 style="margin-top: 0; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem;">
                    <i class="fas fa-calendar-check" style="color: var(--primary-color)"></i> 
                    My Event History
                </h2>
                
                <div id="eventsList" class="event-list" style="flex: 1;">
                    <!-- Injected dynamically -->
                    <div style="text-align: center; padding: 2rem;">
                        <i class="fas fa-circle-notch fa-spin" style="color: var(--primary-color); font-size: 2rem;"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('campus_auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Fetch profile data
                const profileRes = await fetch(`${API_BASE_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (profileRes.status === 401 || profileRes.status === 403) {
                    throw new Error('Unauthorized');
                }
                
                if (!profileRes.ok) throw new Error('Failed to load profile');
                const user = await profileRes.json();

                // Populate UI
                document.getElementById('displayName').textContent = user.name;
                document.getElementById('displayRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
                document.getElementById('nameInput').value = user.name;
                document.getElementById('emailInput').value = user.email;
                document.getElementById('studentIdInput').value = user.studentId;

                // Fetch registered events
                const eventsRes = await fetch(`${API_BASE_URL}/my-registrations`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (eventsRes.ok) {
                    const events = await eventsRes.json();
                    const eventsList = document.getElementById('eventsList');
                    
                    if (events.length > 0) {
                        eventsList.innerHTML = events.map(event => `
                            <div class="event-item">
                                <h3>${event.name}</h3>
                                <div class="event-meta">
                                    <span><i class="far fa-calendar"></i> ${new Date(event.date).toLocaleDateString()}</span>
                                    <span><i class="fas fa-map-marker-alt"></i> ${event.venue}</span>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        eventsList.innerHTML = '<p style="text-align: center; color: var(--text-light); padding: 2rem; background: var(--bg-color); border-radius: 0.5rem; border: 1px dashed var(--card-border);">No registrations yet. Visit the Events page to register!</p>';
                    }
                }

                // Show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('profileContent').style.display = 'grid';

            } catch (error) {
                console.error(error);
                if (error.message === 'Unauthorized') {
                    alert('Session expired. Please login again.');
                    logout();
                } else {
                    alert('Error loading profile info.');
                }
            }
        });

        // Handle form submission
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            const originalContent = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="loader"></span> Saving...';
            
            const newName = document.getElementById('nameInput').value;
            const token = localStorage.getItem('campus_auth_token');

            try {
                const res = await fetch(`${API_BASE_URL}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name: newName })
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('displayName').textContent = newName;
                    
                    // Also update user node in localstorage if it's there
                    const sessionUser = JSON.parse(localStorage.getItem('campus_user'));
                    if (sessionUser) {
                        sessionUser.name = newName;
                        localStorage.setItem('campus_user', JSON.stringify(sessionUser));
                    }
                    
                    const successMsg = document.getElementById('successMsg');
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);
                } else {
                    const error = await res.json();
                    alert(error.error || 'Failed to update profile');
                }
            } catch (error) {
                console.error(error);
                alert('Network error while updating profile');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalContent;
            }
        });
    </script>
</body>
</html>
