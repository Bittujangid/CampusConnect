<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Map - CampusConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        #map {
            width: 100%;
            height: 400px;
            border-radius: var(--radius);
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-map-marked-alt"></i> Campus Map</h1>
            <p>Find your way around</p>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="list-container">
            <!-- Interactive Map -->
            <div class="list-item" style="padding: 0; overflow: hidden;">
                <div id="map"></div>
            </div>

            <h2>Important Locations</h2>
            <div id="locationsList" class="list-container">
                <!-- Locations will be loaded here -->
                <div class="list-item">Loading locations...</div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 CampusConnect</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Initialize Google Map
        function initMap() {
            // Define locations
            const canteenLocation = { lat: 26.790454, lng: 75.828045 };
            const libraryLocation = { lat: 26.790594, lng: 75.828275 };

            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 17,
                center: canteenLocation,
                mapTypeControl: true,
                streetViewControl: true,
                fullscreenControl: true
            });

            // Add Canteen marker (Red)
            const canteenMarker = new google.maps.Marker({
                position: canteenLocation,
                map: map,
                title: 'Canteen',
                animation: google.maps.Animation.DROP,
                icon: {
                    url: 'http://maps.google.com/mapfiles/ms/icons/red-dot.png'
                }
            });

            // Add info window for Canteen
            const canteenInfoWindow = new google.maps.InfoWindow({
                content: '<div style="padding: 5px;"><strong>Canteen</strong><br>Campus Dining Area</div>'
            });

            canteenMarker.addListener('click', () => {
                canteenInfoWindow.open(map, canteenMarker);
            });

            // Add Library marker (Blue)
            const libraryMarker = new google.maps.Marker({
                position: libraryLocation,
                map: map,
                title: 'Library',
                animation: google.maps.Animation.DROP,
                icon: {
                    url: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'
                }
            });

            // Add info window for Library
            const libraryInfoWindow = new google.maps.InfoWindow({
                content: '<div style="padding: 5px;"><strong>Library</strong><br>Main Campus Library</div>'
            });

            libraryMarker.addListener('click', () => {
                libraryInfoWindow.open(map, libraryMarker);
            });

            // Adjust map bounds to show both markers
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(canteenLocation);
            bounds.extend(libraryLocation);
            map.fitBounds(bounds);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLocations();
        });

        async function loadLocations() {
            const list = document.getElementById('locationsList');
            const locations = await fetchData('/locations');

            if (locations.length === 0) {
                list.innerHTML = '<div class="list-item">No locations found.</div>';
                return;
            }

            list.innerHTML = locations.map(loc => `
                <div class="list-item">
                    <h3><i class="fas fa-map-pin" style="color: var(--primary-color); margin-right: 0.5rem;"></i> ${loc.name}</h3>
                    <p>${loc.description}</p>
                    <a href="${loc.map_link}" target="_blank" class="btn" style="display: inline-block; margin-top: 1rem; text-decoration: none;">View on Google Maps</a>
                </div>
            `).join('');
        }
    </script>
    <script>
        // Use a self-executing function to avoid global scope pollution
        (async function loadGoogleMaps() {
            try {
                // 1. Fetch API Key from server
                const response = await fetch('/api/config/google-maps');
                const data = await response.json();
                
                if (!data.apiKey) {
                    console.error('❌ Failed to fetch Google Maps API Key');
                    return;
                }

                // 2. Dynamically create script tag
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${data.apiKey}&callback=initMap`;
                script.async = true;
                script.defer = true;
                
                // 3. Append to body
                document.body.appendChild(script);
                console.log('✅ Google Maps script loaded dynamically');
            } catch (error) {
                console.error('❌ Error loading Google Maps:', error);
            }
        })();
    </script>
</body>

</html>
